spring.application.name=demo
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/hrms_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are created and changed only by Flyway files in src/main/resources/db/migration
# (V1__baseline.sql, then V2__..., V3__...). Hibernate just checks that they match the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security & CORS
hrms.auth.secret=${HRMS_AUTH_SECRET:}
hrms.cors.allowed-origins=${HRMS_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ZeptoMail Configuration (set ZEPTOMAIL_TOKEN environment variable for live email delivery)
zeptomail.url=${ZEPTOMAIL_URL:https://api.zeptomail.in/v1.1/email}
zeptomail.token=${ZEPTOMAIL_TOKEN:}
zeptomail.from.name=${ZEPTOMAIL_FROM_NAME:Maaya World}
zeptomail.from.email=${ZEPTOMAIL_FROM_EMAIL:noreply@themaayaworld.com}
hrms.portal.url=${HRMS_PORTAL_URL:http://localhost:5173/login}
hrms.logo.url=${HRMS_LOGO_URL:https://raw.githubusercontent.com/maayaworldtech-droid/Hrms/main/src/assets/logo-new.png}
